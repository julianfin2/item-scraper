name: Release Browser Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Package Extension Files
        run: |
          mkdir -p dist/icons
          cp manifest.json background.js content.js sidepanel.html sidepanel.js style.css LICENSE dist/
          cp icons/*.png dist/icons/
          cd dist
          zip -r ../item-scraper-${{ github.ref_name }}.zip .

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: '*.zip'

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: '*.zip'
          generate_release_notes: true
